[package]
name = "tg-player"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gramwave, a read-only Telegram music player for Linux"

[workspace]
members = ["crates/domain", "crates/application"]
resolver = "2"

[features]
default = ["telegram"]
native-tests = []
telegram = ["dep:tdlib-rs"]

[dependencies]
tg-player-domain = { path = "crates/domain" }
tg-player-application = { path = "crates/application" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-range-header = "0.4"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
tempfile = "3"
futures-util = "0.3"
tdlib-rs = { version = "=1.4.0", optional = true, features = ["download-tdlib"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.28", features = ["bundled", "backup"] }
libloading = "0.8"
qrcode = { version = "0.14", default-features = false }
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }

fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
egui_extras = { version = "0.36.2", features = ["svg", "image", "file"] }

[build-dependencies]
tdlib-rs = { version = "=1.4.0", optional = true, features = ["download-tdlib"] }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4", features = ["build"] }
