[package]
name = "gramwave"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Gramwave, a read-only Telegram music player for Linux"

[[bin]]
name = "gramwave-dev"
path = "src/main.rs"

[workspace]
members = ["crates/domain", "crates/application"]
resolver = "2"

[features]
default = ["audio", "webm-emoji", "download-tdlib", "vulkan"]
native-tests = ["audio", "webm-emoji"]
release-branding = []
audio = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:rodio", "dep:rtrb", "dep:symphonia", "dep:symphonia-adapter-libopus"]
webm-emoji = ["dep:rusty_vp9", "dep:webm-iterable"]
telegram = ["dep:tdlib-rs"]
download-tdlib = ["telegram", "tdlib-rs/download-tdlib"]
vulkan = ["eframe/wgpu_no_default_features", "dep:wgpu"]

[dependencies]
gramwave-domain = { path = "crates/domain" }
gramwave-application = { path = "crates/application" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "fs", "io-util", "macros", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-range-header = "0.4"
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }
rtrb = { version = "0.3", optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "id3v2", "isomp4", "mkv", "mpa", "ogg", "pcm", "vorbis", "wav"], optional = true }
symphonia-adapter-libopus = { version = "0.3", optional = true }
rusty_vp9 = { version = "0.3.0", optional = true }
webm-iterable = { version = "0.7.1", optional = true }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
tempfile = "3"
futures-util = "0.3"
tdlib-rs = { version = "=1.4.0", optional = true }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
qrcode = { version = "0.14", default-features = false }
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1"
tlottie = { git = "https://github.com/dkaraush/tlottie", rev = "92df98dc209bc39b1e567ec74a8c86a0af5239de" }

fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-titlebar = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
egui_extras = { version = "0.36.2", features = ["svg", "image", "file"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ksni = { version = "0.3.7", features = ["blocking"] }
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wgpu = { version = "30.0", default-features = false, features = ["vulkan"], optional = true }
winit = { version = "0.30", default-features = false }

[build-dependencies]
tdlib-rs = { version = "=1.4.0", optional = true }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4", features = ["build"] }

[patch.crates-io]
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
